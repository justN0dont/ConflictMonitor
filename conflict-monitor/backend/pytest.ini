[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# -ra prints the reason for anything that is not a plain pass. The suite
# contains no skipif and no conditional skips: a missing database or a
# blocked network call is a FAILURE with a stack trace, never a quiet skip
# that reads green. --strict-markers turns a typo'd marker into an error
# instead of a marker that silently does nothing.
addopts = -ra --strict-markers --strict-config
xfail_strict = true
