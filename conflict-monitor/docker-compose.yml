services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-conflict_monitor}
    # Loopback only (C61): published on 0.0.0.0 this was the whole archive,
    # reachable from the network with the default password. Nothing outside
    # this host needs Postgres; the backend reaches it as `db` on the compose
    # network, not through this port.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    # Loopback only (C60). To serve it beyond this machine, put a reverse
    # proxy with TLS in front, and add its public origin to CORS_ORIGINS.
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      # Built from the same variables the db service uses, so changing
      # POSTGRES_PASSWORD changes both (C61: it was hardcoded here). A password
      # with URL-special characters (@ : / ? #) must be percent-encoded.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-conflict_monitor}
      DEMO_MODE: ${DEMO_MODE:-false}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - telegram_sessions:/app/sessions

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    # No env_file: the frontend gets only the VITE_* values below. With
    # `env_file: .env` it held every backend secret (Telegram, Anthropic,
    # admin token) in a container whose job is serving browser code. The
    # VITE_* values themselves are compiled into that code and ARE public:
    # use tokens restricted by URL in the Mapbox / Google / Cesium consoles.
    environment:
      VITE_MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
      VITE_GOOGLE_MAPS_KEY: ${GOOGLE_MAPS_KEY:-}
      VITE_CESIUM_ION_TOKEN: ${CESIUM_ION_TOKEN:-}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  pgdata:
  telegram_sessions:
